[project]
name = "jazz-agent"
version = "0.1.0"
description = "NYC jazz club schedules -> weekly Spotify playlists, with a taste-graph MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "trafilatura>=1.9",
    "playwright>=1.45",
    "anthropic>=1.0.0",
    "fastmcp>=3.4.7",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
]
test = [
    "pytest>=8.3",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jazz_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.importlinter]
root_package = "jazz_agent"

[[tool.importlinter.contracts]]
name = "core and ports are independent of adapters"
type = "forbidden"
source_modules = ["jazz_agent.core", "jazz_agent.ports"]
forbidden_modules = ["jazz_agent.adapters"]
